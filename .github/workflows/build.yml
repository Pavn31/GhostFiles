name: Build GhostFiles

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            artifact: GhostFiles-Linux

          - os: windows-latest
            name: windows
            artifact: GhostFiles-Windows

          - os: macos-latest
            name: macos
            artifact: GhostFiles-macOS

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build
        run: |
          pyinstaller --clean --noconfirm --windowed --name GhostFiles main.py

      - name: Upload Linux build
        if: matrix.name == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/GhostFiles/

      - name: Upload Windows build
        if: matrix.name == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/GhostFiles/

      - name: Upload macOS build
        if: matrix.name == 'macos'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/GhostFiles.app/
